set -g prefix C-a
set -g mouse on
set -g default-terminal "screen-256color"
set -g terminal-overrides ",xterm-256color:Tc"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-option -g default-shell /bin/zsh
set-option -g history-limit 10000
set -g renumber-windows on
set -g focus-events on

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# Toggle mouse mode with Leader + m
bind m \
  set -g mouse \;

# Status bar
set -g status-left "#[bold]  #S #[default] "

# Window list. With several agent sessions running side by side, the useful
# signals are: which windows hide panes behind a zoom (), how many panes
# that is, and what each Claude session wants -  it is blocked on you,
#  it finished and is idle. Those two come from Claude Code's own
# Notification/Stop hooks via tmux/claude-tmux-notify.sh, not from watching
# terminal output; @claude is the window option they set.
#
# monitor-activity is deliberately NOT used: a running agent redraws its
# spinner constantly, which would leave every background window permanently
# flagged and the marker meaningless.

# Arriving at a window means you have seen it - drop its marker.
set-hook -g after-select-window 'set -w -u @claude'
# A visible separator between windows, and a columns glyph binding the pane
# count to its own window - without it " 2 glossier 2 │ 3 cayena" reads as
# though the trailing 2 were the next window's index.
set -g window-status-separator "│"

# Roman numerals for the window index, so it does not read as just another
# number sitting next to the pane count. Defined once as a user option and
# expanded per window with #{E:...} - inlining the chain would put 650
# characters into both format strings. You still press C-a <digit> to switch.
set -g @win_index "#{?#{==:#{window_index},1},I,#{?#{==:#{window_index},2},II,#{?#{==:#{window_index},3},III,#{?#{==:#{window_index},4},IV,#{?#{==:#{window_index},5},V,#{?#{==:#{window_index},6},VI,#{?#{==:#{window_index},7},VII,#{?#{==:#{window_index},8},VIII,#{?#{==:#{window_index},9},IX,#{?#{==:#{window_index},10},X,#{?#{==:#{window_index},11},XI,#{?#{==:#{window_index},12},XII,#{?#{==:#{window_index},13},XIII,#{?#{==:#{window_index},14},XIV,#{?#{==:#{window_index},15},XV,#{?#{==:#{window_index},16},XVI,#{?#{==:#{window_index},17},XVII,#{?#{==:#{window_index},18},XVIII,#{?#{==:#{window_index},19},XIX,#{?#{==:#{window_index},20},XX,#{window_index}}}}}}}}}}}}}}}}}}}}}"
set -g window-status-format "#{?#{==:#{@claude},waiting},#[fg=colour196#,bold],} #{E:@win_index} #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1},#{?#{==:#{window_panes},2}, ●●,#{?#{==:#{window_panes},3}, ●●●,#{?#{==:#{window_panes},4}, ●●●●, ●●●●⁺}}},}#{?#{==:#{@claude},waiting}, ,}#{?#{==:#{@claude},done}, ,} #[default]"
set -g window-status-current-format " #{E:@win_index} #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1},#{?#{==:#{window_panes},2}, ●●,#{?#{==:#{window_panes},3}, ●●●,#{?#{==:#{window_panes},4}, ●●●●, ●●●●⁺}}},} "
set -g window-status-current-style "bg=black,fg=green,bold"
set -g status-interval 5
set -g status-right-length 100
# Nerd Font glyphs, not color emoji — emoji come from a separate font whose
# glyphs overflow the cell vertically and spill over the top of the status bar.
set -g status-right "#(~/.dotfiles/tmux/status-stats.sh) │  #{?mouse,on,off} │  %H:%M %d-%b"


bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
