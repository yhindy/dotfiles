set -g prefix C-a
set -g mouse on
set -g default-terminal "screen-256color"
set -g terminal-overrides ",xterm-256color:Tc"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-option -g default-shell /bin/zsh
set-option -g history-limit 10000
set -g renumber-windows on
set -g focus-events on

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# Toggle mouse mode with Leader + m
bind m \
  set -g mouse \;

# Status bar
set -g status-left "#[bold]  #S #[default] "

# Window list. With several agent sessions running side by side, the useful
# signals are: which windows hide panes behind a zoom (), how many panes
# that is, and what each Claude session wants -  it is blocked on you,
#  it finished and is idle. Those two come from Claude Code's own
# Notification/Stop hooks via tmux/claude-tmux-notify.sh, not from watching
# terminal output; @claude is the window option they set.
#
# monitor-activity is deliberately NOT used: a running agent redraws its
# spinner constantly, which would leave every background window permanently
# flagged and the marker meaningless.

# Roman numerals for the window index, so it does not read as just another
# number on the bar. Defined once and expanded per window with #{E:...} -
# inlining the 650-character chain into both formats would bury them.
# You still press C-a <digit> to switch windows.
set -g @win_index "#{?#{==:#{window_index},1},I,#{?#{==:#{window_index},2},II,#{?#{==:#{window_index},3},III,#{?#{==:#{window_index},4},IV,#{?#{==:#{window_index},5},V,#{?#{==:#{window_index},6},VI,#{?#{==:#{window_index},7},VII,#{?#{==:#{window_index},8},VIII,#{?#{==:#{window_index},9},IX,#{?#{==:#{window_index},10},X,#{?#{==:#{window_index},11},XI,#{?#{==:#{window_index},12},XII,#{?#{==:#{window_index},13},XIII,#{?#{==:#{window_index},14},XIV,#{?#{==:#{window_index},15},XV,#{?#{==:#{window_index},16},XVI,#{?#{==:#{window_index},17},XVII,#{?#{==:#{window_index},18},XVIII,#{?#{==:#{window_index},19},XIX,#{?#{==:#{window_index},20},XX,#{window_index}}}}}}}}}}}}}}}}}}}}}"

# A zoomed window wears [brackets], and its hidden panes show as hollow pips -
# the glyph alone was too quiet to notice.
# One dot per pane, coloured by what the Claude session in that pane is doing:
# red blocked on you, yellow working, white finished, grey not a Claude pane.
# #{P:...} loops over the window's panes (tmux 3.1+) and reads the per-pane
# @claude_pane option that tmux/claude-tmux-notify.sh sets from Claude Code's
# hooks. Green would be the natural "done" colour but the status bar itself is
# green - white reads on it, bright green does not.
#
# The window-level styling below is DERIVED from those panes with #{m:*waiting*}
# rather than stored separately, so a window with two Claude panes cannot end up
# with one pane's state overwriting the other's.
set -g window-status-separator "│"
set -g window-status-format "#{?#{m:*waiting*,#{P:#{@claude_pane}}},#[fg=colour196#,bold],} #{E:@win_index} #{?window_zoomed_flag,[#W],#W}#{?#{m:*waiting*,#{P:#{@claude_pane}}}, ,} #{P:#{?#{==:#{@claude_pane},waiting},#[fg=colour196],#{?#{==:#{@claude_pane},running},#[fg=colour226],#{?#{==:#{@claude_pane},done},#[fg=colour231],#[fg=colour238]}}}#{?window_zoomed_flag,#{?pane_active,●,○},●}}#[default] "
set -g window-status-current-format " #{E:@win_index} #{?window_zoomed_flag,[#W],#W} #{P:#{?#{==:#{@claude_pane},waiting},#[fg=colour196],#{?#{==:#{@claude_pane},running},#[fg=colour226],#{?#{==:#{@claude_pane},done},#[fg=colour231],#[fg=colour238]}}}#{?window_zoomed_flag,#{?pane_active,●,○},●}}#[fg=green#,bg=black#,bold] "
set -g window-status-current-style "bg=black,fg=green,bold"
set -g status-interval 5
set -g status-right-length 100
# Nerd Font glyphs, not color emoji — emoji come from a separate font whose
# glyphs overflow the cell vertically and spill over the top of the status bar.
set -g status-right "#(~/.dotfiles/tmux/status-stats.sh) │  #{?mouse,on,off} │  %H:%M %d-%b"


bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
