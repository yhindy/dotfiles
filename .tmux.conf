set -g prefix C-a
set -g mouse on
set -g default-terminal "screen-256color"
set -g terminal-overrides ",xterm-256color:Tc"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-option -g default-shell /bin/zsh
set-option -g history-limit 10000
set -g renumber-windows on
set -g focus-events on

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# Toggle mouse mode with Leader + m
bind m \
  set -g mouse \;

# Status bar
set -g status-left "#[bold]  #S #[default] "

# Window list. With several agent sessions running side by side, the useful
# signals are: which windows hide panes behind a zoom (), how many panes
# that is, and what each Claude session wants -  it is blocked on you,
#  it finished and is idle. Those two come from Claude Code's own
# Notification/Stop hooks via tmux/claude-tmux-notify.sh, not from watching
# terminal output; @claude is the window option they set.
#
# monitor-activity is deliberately NOT used: a running agent redraws its
# spinner constantly, which would leave every background window permanently
# flagged and the marker meaningless.

# Arriving at a window means you have seen it - drop its marker.
set-hook -g after-select-window 'set -w -u @claude'
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1}, #{window_panes},}#{?#{==:#{@claude},waiting}, ,}#{?#{==:#{@claude},done}, ,} "
set -g window-status-current-format " #I #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1}, #{window_panes},} "
set -g window-status-current-style "bg=black,fg=green,bold"
set -g status-interval 5
set -g status-right-length 100
# Nerd Font glyphs, not color emoji — emoji come from a separate font whose
# glyphs overflow the cell vertically and spill over the top of the status bar.
set -g status-right "#(~/.dotfiles/tmux/status-stats.sh) │  #{?mouse,on,off} │  %H:%M %d-%b"


bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
